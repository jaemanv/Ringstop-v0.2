name: Build Windows plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Ringstop-Windows
          path: |
            build/Ringstop_artefacts/Release/VST3
            build/Ringstop_artefacts/Release/Standalone
